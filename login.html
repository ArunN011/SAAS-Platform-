<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Stackly SaaS</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>


    <main class="login-page">


      

        <div class="login-bg-grid"></div>

        <div class="login-bg-glow login-glow-one"></div>

        <div class="login-bg-glow login-glow-two"></div>


        <section class="login-card">


            <!-- Back Home -->

            <a
                href="index.html"
                class="back-home"
            >

                <i class="bi bi-arrow-left"></i>

                <span>
                    Back To Home
                </span>

            </a>




            <div class="login-content">



                <a
                    href="index.html"
                    class="login-logo"
                >

                    <img
                        src="Assets/BrownLogo.webp"
                        alt="Stackly"
                    >

                    

                </a>



                <div class="login-heading">

                    <h1>
                        Welcome Back
                    </h1>

                    <p>
                        Sign in to access your secure SaaS dashboard.
                    </p>

                </div>



                <div class="role-selector">


                    <button
                        type="button"
                        class="role-button active"
                        data-role="user"
                    >

                        <i class="bi bi-person"></i>

                        <span>
                            User
                        </span>

                    </button>


                    <button
                        type="button"
                        class="role-button"
                        data-role="admin"
                    >

                        <i class="bi bi-shield-lock"></i>

                        <span>
                            Admin
                        </span>

                    </button>

                </div>


                <form
                    id="loginForm"
                    class="login-form"
                    novalidate
                >



                    <div class="login-field">

                        <label for="loginEmail">
                            Email Address
                        </label>


                        <div class="input-wrapper">

                            <i class="bi bi-envelope"></i>

                            <input
                                type="email"
                                id="loginEmail"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>



                    <div class="login-field">

                        <label for="loginPassword">
                            Password
                        </label>


                        <div class="input-wrapper">

                            <i class="bi bi-lock"></i>

                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                                minlength="6"
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password"
                            >

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>

                    </div>


                    <div class="login-options">

                        <label class="remember-box">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>
                                Remember Me
                            </span>

                        </label>


                        <a
                            href="error.html"
                            class="forgot-password"
                        >
                            Forgot Password?
                        </a>

                    </div>




                    <button
                        type="submit"
                        class="login-submit"
                    >

                        <span>
                            Login
                        </span>

                        <i class="bi bi-arrow-right"></i>

                    </button>



                    <p
                        id="loginMessage"
                        class="login-message"
                        aria-live="polite"
                    ></p>


                    <div class="register-text">

                        <span>
                            Don't have an account?
                        </span>

                        <a href="register.html">
                            Create Account
                        </a>

                    </div>


                </form>

            </div>

        </section>

    </main>


   

    <script
        src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
    ></script>


   

    <script
        src="login.js"
    ></script>

</body>

</html>
