<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create your Stackly SaaS account"
    >

    <title>Create Account | Stackly</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >



    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    

    <link
        rel="stylesheet"
        href="register.css"
    >

</head>


<body>



    <main class="signup-page">


       

        <div class="signup-orb signup-orb-one"></div>

        <div class="signup-orb signup-orb-two"></div>

        <div class="signup-grid"></div>



     

        <section class="signup-card">


        

            <a
                href="index.html"
                class="back-home"
            >

                <i class="bi bi-arrow-left"></i>

                <span>
                    Back To Home
                </span>

            </a>




            <a
                href="index.html"
                class="signup-logo"
            >

                <img
                    src="Assets/BrownLogo.webp"
                    alt="Stackly"
                >

            </a>



            <!-- Heading -->

            <div class="signup-heading">

                <h1>
                    Create Account
                </h1>

                <p>
                    Join Stackly and start managing
                    your business smarter.
                </p>

            </div>



            <!-- =================================================
                 ROLE SWITCH
            ================================================== -->

            <div class="role-switch">


                <button
                    type="button"
                    class="role-option active"
                    data-role="user"
                >

                    <i class="bi bi-person"></i>

                    <span>
                        User
                    </span>

                </button>


                <button
                    type="button"
                    class="role-option"
                    data-role="admin"
                >

                    <i class="bi bi-shield-lock"></i>

                    <span>
                        Admin
                    </span>

                </button>

            </div>



            <!-- =================================================
                 FORM
            ================================================== -->

            <form
                class="signup-form"
                id="signupForm"
                novalidate
            >


                <!-- Full Name -->

                <div class="form-group full-width">

                    <label for="fullName">
                        Full Name
                    </label>


                    <div class="input-wrapper">

                        <i class="bi bi-person"></i>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                        >

                    </div>

                </div>



                <!-- Email -->

                <div class="form-group full-width">

                    <label for="email">
                        Email Address
                    </label>


                    <div class="input-wrapper">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                        >

                    </div>

                </div>



                <!-- Phone -->

                <div class="form-row">


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>


                        <div class="input-wrapper">

                            <i class="bi bi-telephone"></i>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Phone Number"
                                autocomplete="tel"
                            >

                        </div>

                    </div>



                    <!-- Company -->

                    <div class="form-group">

                        <label for="company">
                            Company
                        </label>


                        <div class="input-wrapper">

                            <i class="bi bi-building"></i>

                            <input
                                type="text"
                                id="company"
                                name="company"
                                placeholder="Company Name"
                                autocomplete="organization"
                            >

                        </div>

                    </div>

                </div>



                <!-- Password -->

                <div class="form-group full-width">

                    <label for="password">
                        Password
                    </label>


                    <div class="input-wrapper">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create Password"
                            autocomplete="new-password"
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="Show password"
                        >

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- Confirm Password -->

                <div class="form-group full-width">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>


                    <div class="input-wrapper">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm Password"
                            autocomplete="new-password"
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Show password"
                        >

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- Terms -->

                <div class="terms-row">

                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="terms"
                        >

                        <span class="custom-checkbox"></span>

                        <span class="terms-text">

                            I agree to the

                            <a
                                href="error.html"
                            >
                                Terms & Conditions
                            </a>

                        </span>

                    </label>

                </div>



                <!-- Button -->

                <button
                    type="submit"
                    class="signup-button"
                >

                    <span>
                        Create Account
                    </span>

                    <span class="button-arrow">

                        <i class="bi bi-arrow-right"></i>

                    </span>

                </button>




                <div class="login-link">

                    <span>
                        Already have an account?
                    </span>

                    <a
                        href="login.html"
                    >
                        Login
                    </a>

                </div>


            </form>

        </section>

    </main>




    <script
        src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
    ></script>



    <script
        src="register.js"
    ></script>

</body>

</html>
