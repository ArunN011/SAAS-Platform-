<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Page Not Found | Stackly</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >



    <link
        rel="stylesheet"
        href="error.css"
    >

</head>


<body>


    <main class="error-page">

        <div class="error-grid"></div>

        <div class="error-glow error-glow-one"></div>

        <div class="error-glow error-glow-two"></div>


        <section class="error-card">

            <header class="error-header">

                <a
                    href="index.html"
                    class="error-logo"
                >

                    <img
                        src="Assets/BrownLogo.webp"
                        alt="Stackly"
                    >

                </a>


                <span class="error-status">

                    <span class="error-status-dot"></span>

                    ERROR 404

                </span>

            </header>

            <div class="error-main">

                <div class="error-visual">

                    <div class="error-circle circle-one"></div>

                    <div class="error-circle circle-two"></div>

                    <div class="error-circle circle-three"></div>


                    <div class="error-number">
                        404
                    </div>


                    <div class="error-icon error-icon-one">

                        <i class="bi bi-link-45deg"></i>

                    </div>


                    <div class="error-icon error-icon-two">

                        <i class="bi bi-search"></i>

                    </div>

                </div>



                <div class="error-content">

                    <span class="error-eyebrow">
                        PAGE UNAVAILABLE
                    </span>


                    <h1>
                        This page isn't
                        <span>available.</span>
                    </h1>


                    <p>
                        The page you're looking for may have
                        moved, been removed, or is temporarily
                        unavailable.
                    </p>

                    <div class="error-actions">
                        <button
                            type="button"
                            class="error-btn error-back"
                            id="goBackButton"
                        >

                            <i class="bi bi-arrow-left"></i>

                            <span>
                                Go Back
                            </span>

                        </button>

                        <button
                            type="button"
                            class="error-btn error-home"
                            id="backHomeButton"
                        >

                            <span>
                                Back to Home
                            </span>

                            <i class="bi bi-arrow-up-right"></i>

                        </button>

                    </div>

                </div>

            </div>

            <footer class="error-footer">

                <span>
                    STACKLY SAAS PLATFORM
                </span>

                <div></div>

                <span>
                    Page not found
                </span>

            </footer>

        </section>

    </main>



    <script
        src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
    ></script>
  

    <script
        src="error.js"
    ></script>

</body>

</html>
